note: |
  重さは、製品ページの仕様・取扱説明書・プレスリリースが「約163g」、製品ページの公式画像 mot-acpd67c2_a07.jpg が「約172g」で食い違う。ここでは仕様の163g を入れた。パッケージ込みは約198g。
  発売は2026年8月5日(PR TIMES のプレスリリース https://prtimes.jp/main/html/rd/p/000000339.000078304.html 。楽天・Yahoo!ショッピング・Amazon などの EC モールで販売)。取説 PDF と製品画像のアップロードは 2026年5〜6月。
  型番の似た MOT-ACPD67C2U1 は USB-C×2・USB-A×1 の3ポート充電器(ケーブル内蔵ではない)で、別の製品。
  出力: USB-Cケーブル・USB-Cポートとも 5V3A / 9V3A / 15V3A / 20V3.35A【PD67W】、PPS 5-21V3.35A【67Wmax】。2台同時は3通りの配り方が書かれていて、どれになるかの条件(つないだ機器で決まるか)は公式に書かれていない。取説の図では左(USB-Cポート)と右(ケーブル)の順に 45W 20W / 20W 45W / 30W 30W。
  耐久: 巻き取り部は約20,000回以上の伸縮試験、ケーブルは約10,000回以上の折り曲げ試験をクリア(製品ページ・プレスリリース。メーカーの試験)。
  GaN はプレスリリース「GaN（窒化ガリウム）を採用」と公式画像 mot-acpd67c2_a09.jpg。製品ページの文章には GaN の記載なし。
  公式の注意: ケーブルを急に引き出したり強い力で引っ張らない、引っ張る時や収納する時は手に持ったままゆっくり、手を離すと勢いよく巻き取られる(取説)。保証は日本国内に限る(製品ページの Q&A)。
  公式画像 mot-acpd67c2_a10.jpg には「過電流保護・過電圧保護・短絡保護・温度保護」の図もあるが、安全の機能なので本文には使っていない。
  売り場: 楽天・Yahoo!・Amazon とも「MOT-ACPD67C2」の検索で一番上にこの製品(Amazon の商品名には型番が入っていない)。11/24 確認。
  消費者庁リコール情報サイトで「MOT-ACPD67C2」「MOTTERU」を検索して0件(2026-11-24)。NITE は未確認。
