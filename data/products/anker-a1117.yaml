note: |
  製品ページの見出しに「販路限定」の札。2026-11-14 時点で、楽天・Amazon・Yahoo! を製品名と型番で探しても A1117 は出てこない(出てくるのは前の型の Anker Power Bank (25000mAh, Built-In & 巻取り式USB-Cケーブル) 17,990円)。買える所は公式オンラインストアだけなので stores は空。
  前の型は 2025-05-08 発売の「Anker Power Bank (25000mAh, Built-In & 巻取り式 USB-C ケーブル)」(Anker Japan のお知らせ corp.ankerjapan.com/posts/538、製品ページ URL は a1695)。出力の仕様の書き方は同じ(単ポート 100W・合計 165W)。
  発売は製品ページの「発売月 2026年11月」だけで、日付は無い。
  合計出力は、仕様欄が「165W」、2ポート時の画像が C+C 165W / C+A 133W、3ポート時の画像が「合計130W」。3台以上つなぐと合計が下がる。
  画面(公式の呼び方は液晶画面)に、残量・本体を満充電するまでの時間・各ポートの入出力W・電池の温度・充電回数・最大容量(Battery Health)が出る。最大容量が60%を下回ると「バッテリー状態の確認」が表示される(取説)。
  入力は USB-C1・C2・C3 のどれでも最大100W。3つ同時につなぐと、一番入力の大きいポートで充電する(取説)。
  USB-A は低電流モードあり。容量は「セル容量 25,000mAh」(取説)だけで、Wh・定格容量・電池の種類は製品ページにも取説にも無い。重さは仕様欄・画像とも 約595g。
  消費者庁リコール情報サイトと NITE SAFE-Lite(事故情報・リコール情報)で「A1117」を引いて該当なし(2026-11-14)。
