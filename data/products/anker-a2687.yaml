note: |
  型番は A2687N41(シルバー)。公式ページに発売月の記載は無い。
  1ポートのとき(公式ページ): 全ポート 5V⎓3A / 9V⎓3A / 15V⎓3A / 20V⎓5A / 28V⎓5A(最大140W)。単ポート最大150W は Anker Prime Power Bank (26250mAh, 300W)(A110A)を自動配分モードで充電するときだけ(公式ページの注意・取説の よくある質問)。取説の仕様は 28V⎓5.36A(最大150W)まで書き、「4 ポート利用時 最大 160W」という行もある(3ポートの製品なので誤記と見られる)。
  GaN は公式ページ「GaNPrime™ 2.0」から。PD・PPS は公式ページ・取説に対応の記載が無いので書いていない。PowerIQ 5.0 対応(公式ページ)。
  画面: 公式ページは「タッチ式ディスプレイ」「ポートごとの充電状況のモニタリングや本体の温度状況の確認」。つないだケーブルの種類を「3Aケーブル」(最大60W)「5Aケーブル」(最大100W)「EPRケーブル」(最大240W)と表示する。複数つないだときは上のポートのケーブルだけ表示(取説)。小数点以下1桁まで。本体の向きに合わせて画面が自動で回転する。
  取説の操作は「ボタン」と書いている: 1回押すと画面オン・切替、2秒長押しで画面オフ、2回押すと充電モードの切替(Bluetooth のオン/オフも2回押しと書いてある)、3回押すと画面を手動で回転、7秒長押しで Bluetooth のリセット。
  Bluetooth で Anker アプリにつなぐと、ポートごとの電源オフ(タイマー)・カスタムモード・画面の明るさ(25〜100%)・言語(英・独・日・中)を設定できる。ログインなしでも全機能を使える(取説)。
  折りたたみプラグかどうかは公式ページ・取説の文章に記載が無いので書いていない。
  Anker の自主回収の告知(製品回収情報、最新は2025年10月掲載)に A2687 は入っていない。充電器の回収は2019年7月の PowerPort Atom PD 4 だけ。
