note: |
  ACDC-PD13667BK と MPA-AC13667BK は「販売チャネルの異なる同一仕様の製品」(2026-11-18 のリリース)。仕様欄の文言は2つの製品ページで同じ。写真は MPA-AC13667BK の番号を使った。
  発売はリリースで「11月中旬より新発売」。11/24 時点で製品ページはどちらも「近日発売」。楽天・Amazon・Yahoo! で ACDC-PD13667BK と MPA-AC13667BK を検索して、どちらも出てこなかった(11/24)ので stores は空。売り場に出たら足す。
  値段: リリースの店頭実勢価格は2つとも 6,780円(税込)。製品ページの標準価格は ACDC-PD13667BK が 9,691円、MPA-AC13667BK が 10,428円(税込)で、型番によって違う。
  単独のとき(ポート・ケーブルとも): 5V/9V/15V 3A、20V 3.35A(最大67W)、PPS 5V～21V 3.35A(最大67W)。
  同時のときの電圧: (1) ポート 5V/9V/15V/20V・PPS 5～16V、ケーブル 5V/9V・PPS 5～11V。(2) 両方 5V/9V 3A・15V 2A・20V 1.5A、PPS 5～11V 3A・5～16V 2A。(3) は (1) の逆。
  合計の書き方: 特長欄とリリースは「同時使用時は合計最大65W」。仕様欄の (2) 30W+30W の組み合わせは合計60W なので、65W は (1)(3) のときの値。total_w は書いていない。
  GaN は「GaN II Plus(窒化ガリウムIC使用)」(特長欄)。プラグは仕様欄で「90度スイング構造」。折りたたみとは書かれていないので foldable_plug は書いていない。
  巻き戻すときは、完全に戻るまでケーブルを手で持つよう注意書きがある。USB-C ポート用のケーブルは付属しない。使える温度は 0℃～25℃。日本国内専用。Switch 2 / Switch / Switch Lite の充電に対応。
  消費者庁リコール情報サイトで「エレコム」を引いた15件に、この型番は無い(2026-11-24)。NITE はまだ引いていない。
  出典: 製品ページ https://www.elecom.co.jp/products/ACDC-PD13667BK.html ・ https://www.elecom.co.jp/products/MPA-AC13667BK.html ・ リリース https://www.elecom.co.jp/news/new/20261118-03/
pitch:   # 製品ページの頭の「特徴」(2026-11-24)
  lead: "本体に約91cmの USB-C ケーブルを巻き取って収める67W の AC 充電器です。必要な長さだけ引き出して使い、終わったら本体に巻き戻せるので、床のコンセントから机の上のノートPCまでケーブル1本を持ち歩かずに届きます。"
  points:
    - "ケーブルか USB-C ポートの片方だけなら最大67W で、ノートPCの充電にも使える"
    - "ケーブルとポートで2台同時に充電でき、配分は 45W+20W・30W+30W・20W+45W から充電器が自動で選ぶ"
    - "大きさ約69×34.5×55mm、重さ約170g。プラグは90度スイングで、カバンのポケットにも収まる"
