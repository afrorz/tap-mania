note: |
  差し込み口は公式の呼び方で「ホコリ・ゴミの侵入を防ぐ扉付」。熱や衝撃に強い PBT 樹脂。難燃の規格は公式に記載なし。
  プラグは耐トラッキングカバー付きの L 型プラグ(回転するとは書かれていない)。差し込み口とプラグは 2P(公式画像)。
  取扱説明書には、雷ガード表示 LED が消えている場合はサージ低減効果がなくなっているので新しい製品と交換するよう、また、電話や FAX の通信線がある機器などの雷サージ保護を保証するものではない、と書かれている。
  独立スイッチ(LED ランプ付き)。AC アダプターが2つ差せる。置き方で差し込み口を上向きにも横向きにもできる。
  使用温度範囲 -10℃〜40℃。屋内専用・国内専用。同じシリーズに 2m・3m・5m(WLK-42S・43S・45S)がある。
  マグネットは別売(WXP-MG01)。
  出典: 公式カタログ https://www.elpa.co.jp/webooks/2024/pdf/14.pdf ・ 値段 https://www.elpadirect.jp/products/4901087225743/ (11/12 時点で「欠品のため入荷まち」)
