note: |
  発表は 2026-01-27 のリリースで「新発売いたしました」。製品ページは 11/24 時点で「発売中」、標準価格は 3,542円(税込)。
  型番は 1m ブラック MPA-CCW10BK・1m ホワイト MPA-CCW10WH・2m ブラック MPA-CCW20BK・2m ホワイト MPA-CCW20WH(2m は店頭実勢 2,680円)。
  同じリリースで、電力ディスプレイ付き延長ケーブル(片側 USB-C プラグ・片側 USB-C ポート、最大240W、約1m)の MPA-CCWE10BK / MPA-CCWE10WH も出た。延長はこの製品を含めて最大2m・合計2本まで。製品データはケーブルの1m ブラック1件だけ。
  ほかに MPA-CCECW10BK(製品名は同じ「電力ディスプレイ付きケーブル(USB-C - USB-C/240W/なめらか)」、シリコン外皮、標準価格 2,827円)も製品ページがある。販売チャネル違いの物とみられるが、公式に「同一仕様」とは書かれていないので、ここでは分けて扱う。
  表示される電力値は目安で、ケーブル自身の動作に使う電力は除いた、接続した機器に供給される値(公式の注意)。ディスプレイは機器がつながっているときだけ点き、点くまで数秒かかることがある。間にアダプター・ハブ・ドッキングステーションを入れると正しく動かないことがある。
  eMarker は特長欄とリリースに「搭載」とある(仕様欄には項目なし)。映像出力(DisplayPort Alternate Mode)には対応していない。
  売り場: 楽天・Yahoo! に出ている。Amazon は検索の1件目が「エレコム USB Type C ケーブル 1m 240W PD対応 液晶ディスプレイ 電力表示 … シリコン素材」(B0FKB773R1)。
  消費者庁リコール情報サイトで「エレコム」を引いた15件に、この型番は無い(2026-11-24)。NITE はまだ引いていない。
  出典: 製品ページ https://www.elecom.co.jp/products/MPA-CCW10BK.html ・ リリース https://www.elecom.co.jp/news/new/20260127-05/
pitch:   # 製品ページの頭の「特徴」(2026-11-24)
  lead: "USB-C ケーブルのコネクター部に小さなディスプレイがあり、つないだ機器のあいだで流れている充電の電力が数字で出ます。満充電に近づくと数字が小さくなっていくので、充電の終わりどきも見て分かります。"
  points:
    - "USB PD EPR に対応し、最大240W(48V/5A)。高出力のノートPCの充電にも使える"
    - "外皮はやわらかいシリコンで、折り癖がつきにくく、束ねても絡みにくい"
    - "長さ約1m・太さ約4.2mm。色はブラックとホワイト、2m もある"
