note: |
  コードを本体に巻き付けて持ち歩けるモバイルタップ。AC 2個口(シャッター付き・差込口の間隔50mm)、USB-C×2、USB-A×1。
  C1+A は、仕様欄が「65W+18W（合計63W）」で足し算が合わない。底面ラベルと早見表はどちらも 45W+18W なので、そちらを載せた。
  AC の定格も、仕様欄が 14A・1400W、底面ラベルが 13.5A・1350W で食い違う。ラベルの値を載せた。
  PPS は仕様欄に無く、底面ラベルに PPS1:DC5-11V 3A / PPS2:DC5-20V 3.25A とある。GaN の記載は無い。
  USB の入力は AC100〜240V(主な対応国は日本)。過電流保護と自動識別 IC。差込口は耐熱のユリア樹脂。
  発売は 2026-10-16(リリースの日付)。取扱説明書の PDF と保証期間は製品ページに見当たらない。
