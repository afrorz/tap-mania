note: |
  1ポートだけ使うとき、C1・C2 は 5V⎓3A / 9V⎓3A / 15V⎓3A / 20V⎓3.35A(最大67W)、A1・A2 は 5V⎓2.4A(各最大12W)。取説 p.2。
  取説の表は「USB-C1/C2 + USB-A1/A2 = 最大45W+最大12W」のようにまとめて書いてあり、ここでは組み合わせごとに分けて写した。
  合計の出力は資料で書き方が違う。公式ページの仕様は「合計最大出力 65W (USBポートのみ)」、製品名の 67W は1ポート時の最大。取説の「合計出力 最大1,000W」はコンセントを含めた値。
  AC の定格は取説 p.2 で「100-125V~ 50/60Hz 11A」。
  シャッター・トラッキング対策・スイッチ・雷サージ・GaN・PPS は、公式ページ・取説とも記載なし。公式ページには「PowerIQ 3.0搭載」「ActiveShield 2.0」とある。
  大きさ 約100×93×19mm、約298g(ケーブル込み)。型番は A9129N11(黒)・N21(白)・N31(グレイッシュブルー)。発売は2023年9月。
