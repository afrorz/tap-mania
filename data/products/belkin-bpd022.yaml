note: |
  SKU は BPD022fqBK(ブラック)/ BPD022fqWH(ホワイト)/ BPD022fqSA(サンド)。日本の製品ページの見出しは「UltraCharge Slimマグネット式モバイルバッテリー 10K」、ページの title は英語の「UltraCharge Pro Slim Magnetic Power Bank 10K」。
  入力(取扱説明書): 5V⎓3A、9V⎓3A、12V⎓3A、15V⎓2.5A。USB-C 出力: 5V⎓3A、9V⎓3A、12V⎓2.5A、15V⎓2A。ワイヤレス 25W Max。60cm の USB-C to USB-C ケーブルが付属。
  2台同時の配り方は公式の資料で食い違う: 取扱説明書の英語の仕様と背面の印字は「USB-C + Wireless: 15W + 15W (Max 30W)」、取扱説明書の繁体字中国語の仕様は「USB-C + 無線輸出: 5V⎓2.8A + 15W (Max 29W)」、日本の製品ページは「2台のデバイスを同時充電：Qi2ワイヤレス充電で最大25W、USB-Cポート経由で最大30W」と、それぞれの最大だけを書いている。
  USB-C の12V の電流は、取扱説明書「12V⎓2.5A」と背面の印字(公式画像)「12V⎓3A」が食い違う。
  厚さは、仕様欄「16mm」と Belkin公式ショップの画像「約1.5cm」が食い違う。
  取扱説明書(繁体字中国語)では、本体を充電しながらワイヤレスで出すとき、入力 5V ならワイヤレス 5W/6W、9V なら 15W、12V・15V なら 25W まで。日本の製品ページは「30Wパススルー充電に対応」。
  ワイヤレスは日本の製品ページで「Qi2」、Amazon の商品名・海外の報道では「Qi2.2」。Belkin 日本の公式ページで Qi2.2 の文字は確かめていない。
  残量は「デジタルディスプレイ」で%表示(Belkin公式ショップの画像。日本の製品ページの文章には無い)。
  外装の再生プラスチックは、製品ページ「85%以上(ケーブルを除く)」と Belkin公式ショップの画像「70%以上」が食い違う。
  重さは公式の仕様欄に無く、書いていない。
  日本の発売年月は、Belkin のプレスリリース・製品ページで見つけられず released は空。海外では 2026-06 下旬に発表(報道)。
  消費者庁リコール情報サイトは 2026-11-24 に 504 エラーで引けなかった。
  出典: https://www.belkin.com/jp/p/slim-magnetic-power-bank-10k/BPD022fqBK.html ・ 取扱説明書 PDF(manual_url) ・ https://item.rakuten.co.jp/belkin-shop/bpd022fq/
