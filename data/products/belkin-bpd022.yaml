  lead: "厚さ16mm のアルミ合金の外装に、Qi2 のマグネット式ワイヤレス充電と USB-C ポートを載せた10000mAh のバッテリーです。表面は柔らかなシリコンとサンドブラスト加工で、滑りにくく握りやすい形にしたとメーカーは書いています。"
  points:
    - "ワイヤレスは最大25W、USB-C は最大30W。2台同時なら合計30W"
    - "102 × 72 × 16mm。色はブラック・ホワイト・サンドの3色"
    - "30W のパススルー充電に対応し、60cm の USB-C ケーブルが付属"
