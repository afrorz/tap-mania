note: |
  発表は 2026-01-20 のリリースで「新発売いたしました」。型番はブラック DE-C79-10000BK・シルバー DE-C79-10000SV、どちらもオープン価格。
  出力: ケーブル/C1 は 5V/3A・9V/3A・12V/2.5A・15V/2A・20V/1.5A(最大30W)、PPS 5-11V/2.75A(最大30W)。A1 は 5V/3A・9V/2A・10V/2.25A・12V/1.5A(最大22.5W)。入力は 5V/9V/12V/15V/20V・最大30W。
  ケーブルは巻き取り式で長さ約65cm。取扱説明書の図では、ケーブルを「C2」と呼んでいる。取扱説明書 PDF の文書名は「DE-C79L-10000series」だが、表紙の表記は「DE-C79-10000シリーズ」。
  CCC 認証(中国の強制製品認証)の取得品で、中国の国内線にも機内に持ち込めるとリリースに書かれている。160Wh 以下なので日本の機内持ち込みも可(航空会社の規定で例外あり)。
  パススルー(まとめて充電)に対応。低電流モードとおまかせ充電は USB-A だけ。AC 充電器は30W 以上を推奨。付属は絶縁シート×2 と丸紐ストラップ(約0.2m)×1。使える温度は 0℃～40℃。定格容量(5V 換算)は公式に書かれていない。
  1,800mAh のスマホを約3.3回、3,000mAh のスマホを約1.9回充電できる(リリースの目安)。
  売り場: 楽天と Yahoo! には黒・シルバーとも出ている。Amazon は「DE-C79-10000BK」の検索の上位3件に出てこなかった(11/24)。値段は公式に無い(オープン価格)ので書いていない。
  消費者庁リコール情報サイトで「エレコム」を引いた15件に、この型番は無い(2026-11-24)。NITE はまだ引いていない。
  出典: 製品ページ https://www.elecom.co.jp/products/DE-C79-10000BK.html ・ リリース https://www.elecom.co.jp/news/new/20260120-03/
pitch:   # 製品ページの頭の「特徴」(2026-11-24)
  lead: "表面に縦の溝が並んだ、キャリーケースのような形の10000mAh バッテリーです。本体に約65cm の USB-C ケーブルを巻き取って収めていて、必要な長さだけ引き出せるので、充電しながらスマホを手に持って使えます。"
  points:
    - "ケーブルか USB-C ポートなら単独で最大30W。MacBook Air などのノートPCにも充電できる"
    - "ケーブル・USB-C・USB-A の3つで3台まで同時に充電できる(同時のときは合計最大15W)"
    - "色はブラックとシルバー。CCC 認証の取得品で、中国の国内線にも機内に持ち込める"
