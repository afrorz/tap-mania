note: |
  出力の公式の書き方: USB-C は PD 5V/3A、9V/2.22A、12V/1.67A(PD 20W max.)、PPS 5V-5.9V/3A、5V-11V/2A(22W max.)。USB-A は 5V/3A、5V/4.5A、9V/2A、10V/2.25A、12V/1.5A(22.5W max.)。入力は USB-C の PD 5V/3A、9V/2A、12V/1.5A(PD 18W max.)。
  本文の「最大22.5Wの急速充電」は USB-A の値。USB-C の最大は PD 20W・PPS 22W。
  ストラップ型 USB-C to C ケーブル(約20cm)が付属し、ストラップホールに付けて持ち歩ける。公式画像 bk_12 には「PD60W対応ケーブル」とある。本文には「付属ケーブルで給電できない場合は機器付属のケーブルを」との注記がある。
  電源ボタン2秒長押しで低電流モード(約2時間で通常モードに戻る)。残量は LED ランプ4つ(公式画像 bk_11)。公式画像 bk_7 に「iPhone15を約2回充電可能」。
  公式の本文に、製造委託先の試験で約1,000回充放電後も初期容量の約90%を維持(試験は製造委託工場によるもの)、ドリルで穴を開ける試験で発火が見られないことを確認、との記載がある(安全・寿命の話なので pitch には入れず pitch_draft に置いた)。
  リコールは消費者庁リコール情報サイトで「CHE-138」「Solitta」を検索して該当なし(2026-11-24)。cheero の過去の回収は「cheero Flat 10000mAh」(ティ・アール・エイ)で、型番が違う。NITE は未確認。
  出典: 製品ページ https://cheero.shop/products/che-138 (2026-11-24 取得。Amazon B0H3N444XM・楽天 cheeromart/che-138・Yahoo! cheeromart/che-138 への公式リンクあり)
pitch:   # 製品ページの頭の「特徴」(公式の事実だけ。安全・寿命の主張は pitch_draft)
  lead: "付属のストラップが、そのまま USB-C to C ケーブルになる10000mAh のモバイルバッテリーです。電池はゲル状の電解質を使う準固体リチウムイオンで、重さは約185g(ケーブル込み)、厚さは約17mm です。"
  points:
    - "USB-C×2 と USB-A×1 で、スマホなど3台を同時に充電できる(3口合計は最大15W)"
    - "1台だけなら USB-A は最大22.5W、USB-C は PD 最大20W・PPS 最大22W"
    - "パススルー対応で、本体を充電しながらスマホに給電できる。本体の充電は PD 18W で約3時間"
pitch_draft:   # 安全・寿命の主張を含むので、本人が見てから pitch: に戻すか決める(2026-11-24)
  lead: "ゲル状電解質の準固体リチウムイオン電池を使った10000mAh のモバイルバッテリーです。メーカーによると、製造委託先の試験で約1,000回の充放電後も初期容量の約90%を保ち、ドリルで穴を開ける試験でも発火が見られなかったとしています。"
  points:
    - "メーカーは、従来のリチウムイオン電池に比べて発熱や膨張を抑えやすく、高温・低温でも性能が安定しやすいと記載している"
    - "過充電・過放電・短絡・発熱時の自動停止機能を搭載(公式の書き方)"
    - "付属のストラップがそのまま USB-C to C ケーブルになり、3台同時(合計15W)に充電できる"
