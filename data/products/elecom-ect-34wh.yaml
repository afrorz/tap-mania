note: |
  コードの無い直挿し型。プラグは折りたためる(スイングプラグ)。大きさは約59mm角、重さは約130g。日本国内専用。
  1ポートだけ使うと、C は USB PD 20W(5V/3A・9V/2.22A)、A はそれぞれ12W(5V/2.4A)。2ポート以上を同時に使うと、どの組み合わせでも合計最大15Wになり、C も最大15W(5V/3A)になる。PD の 9V は C を1つだけ使うときに限られる。
  USB の合計は、公式に「1ポート時20W」と「同時使用時の合計最大15W」の2つが書かれているので、total_w は書いていない。
  トラッキング対策は、仕様に「耐トラッキング性の要求事項(PSE：電気用品安全法)を満たしたコンセントプラグを採用」とある。AC 差込口は熱硬化性樹脂、刃受け金具は0.8mm厚の板。
  極性対応・雷ガード・スイッチ・抜け止め・通電ランプは、仕様表でどれも「×」。
  取扱説明書は公開されていない(エレコムのマニアル一覧に ECT の型番なし)。
