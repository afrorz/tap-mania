note: |
  発表は 2026-05-12 のリリースで「新発売いたしました」。製品ページは 11/24 時点で「発売中」。標準価格は 5,819円(税込)。
  出力: 5V/9V/12V/15V 3A、20V 2.25A(最大45W)、PPS 5V～16V 3A(最大45W)。GaN は「GaN II Plus(窒化ガリウムIC)」(リリース)。
  電力ディスプレイ: 接続した機器に供給している電力を数字で表示する。充電器自身の動作に使う電力は除いた値で、表示は目安(公式の注意)。機器をつないだときだけ点灯し、点くまで数秒かかることがある。供給電力が小さいとき(満充電に近いなど)は消えるが、給電は続く。満充電に近づくと数字が小さくなるので、充電の終わりどきが分かる。
  プラグ: 仕様欄は「90度スイング構造」、特長欄とリリースは「電源プラグは本体に折りたたんで、すっきりコンパクトに収納」。公式写真 33 でプラグを起こした形が見える。
  兄弟機の MPA-AC13030BK(30W・USB-C×1+USB-A×1・約68g・店頭実勢 3,280円)も同じリリースで出た。2ポート同時は合計最大15W で、そのときは USB PD で出ない(リリース)。製品データは45W のこの1件だけ。
  使える温度は 0℃～25℃。日本国内専用。充電ケーブルは付属しない。Switch 2 / Switch / Switch Lite の充電に対応(ドックでは使えない)。
  売り場: Amazon は検索の1件目に「エレコム USB充電器 Type-C 1ポート 45W … 電力表示 ディスプレイ付き」(B0GXXPZ1W1)、Yahoo! は 3,780円で1件。楽天はこの型番で出てこなかった(11/24)。
  消費者庁リコール情報サイトで「エレコム」を引いた15件に、この型番は無い(2026-11-24)。NITE はまだ引いていない。
  出典: 製品ページ https://www.elecom.co.jp/products/MPA-AC13145BK.html ・ リリース https://www.elecom.co.jp/news/new/20260512-03/
