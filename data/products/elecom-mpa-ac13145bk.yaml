  lead: "正面の小さな電力ディスプレイに、いまスマホやノートPCへ送っている電力が数字で出る45W の充電器です。満充電に近づくと数字が小さくなっていくので、充電がそろそろ終わるかどうかも画面で分かります。"
  points:
