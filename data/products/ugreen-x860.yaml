note: |
  ugreen.jp の製品ページ(製品概要・製品仕様の欄)は 11/24 時点で中身が空で、数字は UGREEN公式楽天市場店(item.rakuten.co.jp/ugreen-gear/75813/)の説明文と公式画像から取った。
  型番: 本体の印字(楽天の公式画像 75813-pse.jpg)で Model: X860・P/N: 75813(グレー)。楽天の色ごとの画像の名前は 35478(オレンジ)・45090(アイスブルー)・75813(グレー)。ugreen.jp では画像の名前と色が合っていない(アイスブルーの写真が X860_75813、ホワイトの写真が X860_45090)。ホワイトの P/N は確かめられていない。
  1m の 100W USB-C ケーブルが付属(楽天の説明)。BCN の記事では「Nexode Air 65W急速充電器(ケーブルセット)」4,280円、色はグレー・ホワイト・ブルー・限定オレンジ。
  値段は、ugreen.jp の通常価格 4,580円と、BCN が伝えた発表時の価格 4,280円が食い違う。
  楽天の説明: USB-C PD3.0 / PPS / QC 対応、トリクル充電(微弱電流モード)の「いたわり充電」、12重以上の保護機能、従来比74%小型化。公式画像: GaNInfinity、エネルギー変換率93%以上、ノートPC 最大65W・スマートフォン最大45W・タブレット最大30W。
  MacBook Air の30分の充電量は、楽天の同じ説明文の中で「30分で50％」と「30分で51％に到達」が食い違う(公式画像は約51%)。iPhone 17 Pro は30分で68%。
  重さは公式に記載が見つからない(依頼メモの約75g は確かめられず、書いていない)。UGREEN 英国版の X860 は 101g・33 x 31 x 54mm とする資料があるが、英国プラグの別仕様なので採らない。
  安全の話(ThermalGuard「発火や熱暴走を防止」、毎秒200回の温度計測など)は公式画像にあるが、書いていない。
  発売: ugreen.jp の掲載 2026-05-09、BCN の記事は 2026-05-13 発表。
  消費者庁リコール情報サイトは 2026-11-24 に 504 エラーで引けなかった。
  出典: https://ugreen.jp/products/nexode-air-65w-charger ・ https://item.rakuten.co.jp/ugreen-gear/75813/ ・ https://www.bcnretail.com/news/detail/20260514_626315.html
