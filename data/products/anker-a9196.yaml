note: |
  発売月は公式ページの仕様欄で「2026年7月」。型番は A9196N11(ブラック)。製品本体と取説の印字はグローバル名「Anker Nano Power Strip (10-in-1, 70W, Clamp)」(公式ページの注意)。
  形: デスクの天板を挟む形。天板の上に出る薄い部分に USB-C×2・USB-A×2・AC 差し込み口×2(上部)、天板の下の箱に AC 差し込み口×4(底部)。取説 p.6 は上部を「頻繁に抜き差しする機器」、底部を「長時間接続したままにする機器」用と案内。上部のコンセントにプラグを差すと、コンセント枠が自動で持ち上がる(取説 p.6)。
  取り付け: 天板の厚さ1.5〜4.5cm、側面の傾斜0〜45°(取説 p.2)。ノブを回してクランプを締める。ガラス製の天板・脚がないデスクには付けられない(公式ページの注意)。
  1ポートのとき: C1・C2 は 5V⎓3A / 9V⎓3A / 15V⎓3A / 20V⎓3.5A(最大70W)、A1・A2 は 5V⎓2.4A(最大12W)。合計最大出力 70W(USB)。取説の仕様は「2ポート利用時：最大70W、3ポート・4ポート利用時：最大69W」。
  C と A を同時に使うと C 45W・A 12W で、A で10分間小型電子機器を充電した後は C 65W・A 5W に変わる(取説 p.7)。複数の USB ポートを使うと USB-C2 の出力が下がる(公式ページの注意)。60W 以上には 5A 対応の E-Marker ケーブルが要る(公式ページの注意)。
  C1+C2 の配り方の例(取説 p.7): ノートPC 45W+スマホ 25W、ノートPC+ノートPC は 35W+35W、ノートPC+小型電子機器は 65W+5W。
  AC の定格は「100-125V~, 11A, 50/60Hz」(公式ページ・取説)。合計の最大W(AC を含む)・コードの長さ・シャッター・トラッキング対策・スイッチ・3ピン・PD・PPS・GaN は、公式ページ・取説とも記載なし。過負荷保護装置(押して復帰するスイッチ)は取説「外観」にある。
  大きさ 約153×101×52mm、約544g(公式ページの仕様)。
  Anker の製品回収情報(最新は2025年10月掲載)に A9196 は入っていない。消費者庁リコール情報サイトで「A9196」を検索して0件(2026-11-24)。NITE は未確認。
  売り場: 楽天・Yahoo!・Amazon とも「A9196」の検索で一番上にこの製品(11/24 確認)。
pitch:   # 製品ページの頭の「特徴」(2026-11-24)
  lead: "デスクの天板に工具なしで挟んで付ける、クランプ式の電源タップです。天板の上の薄い部分に USB-C 2つ・USB-A 2つ・コンセント2口、天板の下の箱にコンセント4口があり、最大10台をまとめて充電できます。"
  points:
    - "USB-C は1ポートなら最大70W。C1+C2 は45W+25W・35W+35W などに配られ、USB の合計は最大70W"
    - "天板の厚さ1.5〜4.5cmに対応し、ノブを回してクランプを締めるだけで固定できる"
    - "上部のコンセントにプラグを差すと、コンセント枠が自動で持ち上がる"
