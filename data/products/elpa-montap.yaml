note: |
  4本のシリコン脚で本体を持ち上げて置く形(プレスリリースの書き方は「4本脚のフォルム(小動物が佇むような形状)」)。脚は取り外せない。滑りにくく、机を傷つけにくい。形は意匠出願中。
  表面は陶器風のマットな微細シボ。素材は本体 ABS+PC、刃受けカバー ユリア樹脂、脚 シリコン樹脂。プラグは L 字型。
  使わない差し込み口には、フィギュア付きのコンセントキャップ(16種・ランダム)を付ける。トラッキング対策と遊び心を兼ねる(公式の書き方)。キャップは別売で、Makuake の全リターンに付く。
  スイッチ・ほこりシャッター・雷サージは公式に記載なし。型番は公式に記載なし。
  USB-C 付きのタイプもある: AC 3個口 + USB-C 1ポート(PD 20W・5V 3A / 9V 2.22A / 12V 1.67A)、AC 14A 100V(合計 1400W)、約155 × 46 × 42.2mm・約270g、一般販売の予定価格 6,970円。
  Makuake の先行販売は 2026-09-15〜12-15、出荷は 2027年1月中旬から。プレスリリースの大きさの並びは 117 × 42 × 46mm で、仕様表と順序が違う。
