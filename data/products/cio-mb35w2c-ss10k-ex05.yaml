note: |
  容量の公式の書き方: 「バッテリー容量 5000mAh/7.4V/37Wh」「バッテリーセル 5000mAh × 2pcs(Total 10000mAh)」「定格容量：5800mAh(5V⎓3A)」。
  「半固体系」は、CIO の注記で「半固体/準固体の定義には統一見解がないため、CIOでは独自基準を満たしたバッテリーを「半固体系」と定義」とされている。
  USB-C は2系統(本体の USB-C ポートと、約22cm の脱着式ケーブル)。公式の表記は「USB-C1/C2(Cable)」で、どちらがケーブル側かは書かれていない。
  出力: 5V⎓3A/9V⎓3A/12V⎓2.91A/15V⎓2.33A/20V⎓1.75A(Max 35W)/PPS 5-11V⎓3A(Max 33W)。入力: 最大30W。
  Qi2.2(25W)。Qi2 の機器へは最大15W。ボタン長押しで 7.5W のセーフティモードに切り替えられる。
  ワイヤレスと有線を同時に使うには、ボタンを5秒長押しして「有線+無線充電切替モード【HY】」にする。HY にしていないと、ワイヤレス充電中にケーブルをつないだ時点でワイヤレスが止まる(取説 p.9・p.12)。
  パススルーは「完全パススルー充電対応」。サイクル回数は約400回。合計の最大出力は1つの値で書かれていないので total_w は書いていない。
  CIO の過去の回収は SMARTCOBY Ex01 SLIM Qi2 & CABLE(2025-01-27)で、型番が違う。
