q: "OWL-PBM10005J"
note: |
  型番は OWL-PBM10005J-BK(ブラック)・-WH(ホワイト)・-BL(ベビーブルー)。
  出力の公式の書き方: USB Type-C 5V/3A、9V/3A、12V/2.5A、15V/2A、20V/1.5A(30W)。ワイヤレス 5W/7.5W/10W/15W/25W。入力も USB Type-C の同じ電圧で30W。
  ワイヤレスの 25W は「iOS26以降のiPhone 16、iPhone 17シリーズなど」の Qi2 25W 対応機器(公式)。Qi2 認証取得。
  パススルーは、本体を充電しながらワイヤレスで機器を充電する形で、その間ワイヤレスは最大5W。USB Type-C は入力と出力の兼用で、同時には使えない(取説 p.13)。
  使用回数は約2000回。使用温度は充電時 0〜45℃、放電時 -20〜60℃。製品ページの本文は「-20～60℃の高温・低温にも強い」と書く。
  本体の残量は LED パネルで1%単位。スマホリングは360°回転し、縦置き・横置きのスタンドになる。付属は USB Type-C to C ケーブル(約30cm)。
  製品ページの本文に、準固体電池は電解質がゲル状で「従来のモバイルバッテリーよりも発火リスクが低い特性」との記載がある(安全の話なので pitch には入れず pitch_draft に置いた)。公式画像 a02 は従来品と並べて「充電回数 約500回→約2000回」「対応温度 0〜35℃→-20〜60℃」と比べている。
  値段は公式サイトに書かれていない。検索では NTT-X Store に 9,878円の掲載があった(公式ではないので price は書いていない)。
  リコールは消費者庁リコール情報サイトで「PBM10005」を検索して該当なし(2026-11-24)。NITE は未確認。
  出典: 製品ページ・取扱説明書(上の URL)・プレスリリース https://www.owltech.co.jp/news/news-press/pr202610071110/ (いずれも 2026-11-24 取得)
