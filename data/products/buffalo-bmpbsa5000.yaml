note: |
  2026-11-05 のプレスリリースで「出荷を開始いたしました」。日付はこの出荷開始の日。製品ページの発売時期は「2026年10月」と書かれている。
  色違い4色(BL・BE・WH・BK)。製品ページは色ごとに分かれていて、ここでは BMPBSA5000BK のページを使った。
  入力は USB PD 5V/2.7A・9V/1.5A(最大13.5W)。パススルーは「対応。スマホを優先して充電し、終わってから本体を充電。合計15W以下・5Vのみ」(仕様欄)。
  使える温度は、放電時 -15〜45℃、充電時 5〜40℃。機内持ち込みは手元で保管する場合に限り可。iPhone 17 へ約0.8回(当社試験)。
  Amazon で売っているのは型番の末尾に X が付いた BMPBSA5000BKX(販売元 バッファローダイレクト、3,380円)。楽天・Yahoo! は公式店(バッファロー公式ストア / buffalodirect)。
  取扱説明書は PDF でなく説明ページ(https://www.buffalo.jp/product/detail/manual/bmpbsa5000bk.html)なので manual_url は空。
  同じシリーズに先行の 10000mAh モデル BMPBSA10000 がある。
  消費者庁リコール情報サイトと NITE SAFE-Lite で「BMPBSA5000」を引いて該当なし(2026-11-14)。
