note: |
  重さは、製品ページの仕様欄と公式画像が「約125g」、取扱説明書 PDF の仕様が「約145g」で食い違う。どちらかに決めず、ここでは製品ページの値を入れた。
  プラグはスイングコンセントプラグ(取説の各部名称)。壁にすき間なく挿さるフルフラットデザイン、表面は傷がつきにくいシボ加工(製品ページ)。
  対応規格は PD3.0 / QC4.0+ / PPS。GaN は製品ページ「次世代半導体のGaNチップ」と取説の表紙「GaN 45W 2ポート巻き取り式充電器」。
  2台同時のときは、つないだ機器に合わせて自動で振り分ける(Nova Intelligence)。手動では振り分けられない(取説)。
  公式の注意: 内蔵ケーブルは強く引き出さない、伸びた状態で手を離すと危険、長時間使うとケーブルが熱を帯びることがある。
  販売の経緯: Makuake(https://www.makuake.com/project/novaport_duo2_45w_cordreel)で先行販売のあと一般販売。一般販売の開始日は公式ページで見つけられず、released は空。画像は 2025年11月のアップロード。
  楽天は CIO 楽天市場店、Amazon は販売元 株式会社CIO(B0GLGC5YFK ブラック / B0GLG24LNJ ホワイト)。Yahoo! では見つからなかった。
  保証期間は取説 PDF にあるが、文字が取り出せず読み切れなかったので空。
  消費者庁リコール情報サイトと NITE SAFE-Lite で「CIO-G45W2C」「NovaPort」を引いて該当なし(2026-11-14)。
