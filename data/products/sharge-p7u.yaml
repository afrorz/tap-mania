note: |
  公式の製品名は「Discho ハイブリッド 格納式 3-in-1 10000mAh パワーバンク」(旧名「格納式 3-in-1 パワーバンク」)。取説の品名は「Discho 3in1 ハイブリッドモバイルバッテリー」、型番 P7U。仕様欄は「モデル P7 / P7U」。
  容量は仕様欄で 10000mAh / 36Wh。取説では公称 5,000mAh(7.2V・36Wh、2セル直列)、定格 4,900mAh(7.2V・35.28Wh)、定格容量 5,700mAh(5V 3A)。10000mAh は 3.6V に換算した値。
  外装は透明なカバーで、中の白い巻き取りリールが見える。巻き取り式ケーブルは約70cm(公式ページの 2.3 フィート)。ドット表示の残量計がある。
  1ポートの出力(ケーブル・ポートとも): 5V 3A / 9V 3A / 10V 2.25A / 12V 2.5A / 15V 2A / 20V 1.5A(最大 30W)。2つ同時は 5V 3A(合計 15W)。2つ同時に使ったときの合計 15W は、公式の宣伝文句「デュアル30ワット」と食い違う。
  本体の充電: USB-C で最大約 20W(5V 3A / 9V 2.22A / 12V 1.67A)。AC プラグで直接コンセントからも充電できる(AC 100-240V)。ただし製品ページに「折りたたみ式プラグは米国バージョンでのみ利用可能」の注記があり、日本で買える物にプラグが付くかは公式から確かめられない。
  パススルー充電に対応。使用温度 0〜25℃(取説)。日本の代理店・販売元は公式に記載なし。発売日は公式に記載なし。
  出典: 公式 https://sharge.com/ja/products/retractable-3-in-1-power-bank ・ 取説 https://cdn.shopify.com/s/files/1/0611/2234/7259/files/SHARGE_P7U_ecc08e9d-357f-49be-9d82-366f99fed1ea.pdf
