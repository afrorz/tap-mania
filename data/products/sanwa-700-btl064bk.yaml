q: "700-BTL064BK"
price: "6,980円(税込・サンワダイレクトの掲載時点。メーカーはオープン価格)"
note: |
  サンワダイレクト(直販)の WEB 限定品。2026-11-05 発売(エルミタージュ秋葉原の発売記事による。製品ページに日付は無い)。楽天・Yahoo! はサンワダイレクトの公式店で 6,980円。Amazon は確かめていない。
  同時出力は、取説 p.12 が「同時使用時:5V/3A(合計最大)」。製品ページの仕様欄「USB合計最大出力 30W」は1ポートのときの値と読める。製品ページの注意書きに「USB Aポートを同時に使用…合計で5V/3Aまで」とあるが、この製品に USB-A は無い(別の製品の文の流用と思われる)。
  タブレットへの2台同時出力には対応しない。ノートパソコンへの給電には対応しない(製品ページの注意書き)。
  パススルーは無い。取説 p.5・p.11「本製品に蓄電中は機器への給電を同時に行わないでください」。入力はケーブルとポートのどちらか一方だけ。
  使える温度は、本体の充電時 0〜35℃、給電時 -10〜45℃。保管は 0〜35℃。容量は 7.4V/5000mAh(37Wh)、3.7V 換算で 10000mAh。
  充電の目安(公式画像 MO12X): iPhone 17 約1.7回、Android 約1.2回、iPad Pro 約0.8回。
  同じシリーズに巻き取りケーブルの無い 700-BTL062BK(デジタル電力表示、5,480円)がある。
  消費者庁リコール情報サイトで「BTL064」を引いて該当なし(2026-11-18)。NITE は未確認。
pitch:   # 製品ページの頭の「ここが面白い」(2026-11-23)
  lead: "本体の中に約70cmのUSB-Cケーブルが巻き取られていて、引き出して手を放すとその長さで止まり、もう一度軽く引くと巻き戻ります。電池は半固体リチウムイオン電池で、厚さ約1.5cmの板のような形です。"
  points:
    - "巻き取りケーブルは10cm〜70cmの好きな長さで止められ、机の上で余ったケーブルが散らからない"
    - "ケーブルとUSB-Cポートのどちらも1ポートなら最大30W。本体への充電も最大30W"
    - "容量は10000mAh、重さ225g。ケーブルを別に持たずに旅行のかばんへ入れておける"
