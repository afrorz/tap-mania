note: |
  バッテリー・AC充電器・一体型ケーブル・Qi2 ワイヤレス充電器の「4in1」。スイングプラグを回して本体に収納でき、底面のスタンドでスマホを横向きに立てられる。
  ワイヤレスは Qi2 正規認証品で最大15W(バッテリーとしてワイヤレスだけを使うとき)。AC充電器として使うときのワイヤレスは最大5W。
  AC充電器として使っているとき、電力に余裕があれば機器への給電と本体への充電を同時に行う(まとめて充電=パススルー)。
  使える温度は、AC充電器として 0〜25℃、モバイルバッテリーとして 0〜35℃。残量は LED パネルに1%単位。USB-A は低電流モードとおまかせ充電。
  発売はリリース(2026-10-21)の「10月下旬より新発売」で、日付は無い。製品ページは 11/14 時点でまだ「近日発売」の表示だが、エレコムダイレクトショップ(楽天 9,890円)と Amazon(販売元 Amazon.co.jp、8,990円、B0HLDR3FYN)で買える状態。
  定格容量(5V 換算)は製品ページに無く、裏面の印字も小さくて読めない。
  エレコムのサイトは自動取得をはじく(403)。画像はブラウザでは開ける。取扱説明書の PDF は製品ページから直接は見つからない。
  消費者庁リコール情報サイトと NITE SAFE-Lite で「EC-C68LBK」を引いて該当なし(2026-11-14)。
