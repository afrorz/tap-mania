note: |
  見た目: 透明な PC の外殻が、ベージュの本体を包む形。上面の黒いパネルに C×2・A×2 と出力ディスプレイ(公式写真)。材質は「本体：PC」(仕様)。外殻の中の部品(基板など)は公式写真では見えない。
  1ポートのとき: C1/C2 は 5V 3A, 9V 3A, 12V 3A, 15V 3A, 20V 3.35A(最大67W)。A1/A2 は 5V 3A, 9V 3A, 10V 2.25A, 12V 2.5A(最大30W)。
  USB の合計は、公式に「1ポート時 67W」と「同時に使うと最大65W/63W/62W/60W/15W」が書かれているので、total_w は書いていない。
  PD・PPS・Quick Charge・GaN は製品ページの説明から。Quick Charge の版は公式に記載なし。
  出力ディスプレイに、供給している電力が数字で出る。10W 以上で充電しているときは稲妻のマークが付く(取説 p.3)。公式写真の注記に「出力ディスプレイ表示は参考値」「日本国内専用」「モバイルバッテリー機能はございません」。
  USB ケーブルは付属しない。セット内容は本体と取扱説明書(保証書付)。使用環境温度は25℃以下、クラスII機器(取説 p.2)。補修用性能部品の保有期間は生産終了後5年(取説 p.5)。
  発売は2026年4月27日(公式のお知らせ https://lifeonproducts.co.jp/news/541468/ )。同じ透明デザインのモバイルバッテリー LCAEA019(20W・5000mAh・3,410円)は、透明なのが下半分だけで、写真での見え方が弱いので今回は入れていない。
  売り場は3つとも公式店(楽天・Yahoo! は「lifeonproducts」の店、Amazon は出品者「Life on Products 公式店」・7,150円)。11/23 確認。
  回収: 公式の「重要なお知らせ」(電気温風機・電気湯沸器・LED電球・ACアダプター PR-F054・スチームアロマ加湿器)に LCAEA018 は入っていない。
