note: |
  容量の公式の書き方は「容量 10000mAh」(製品ページ)、「セル容量 10,000mAh」(取説)。Wh と定格容量は、製品ページにも取説にも載っていない。
  1ポートのときの出力(取説): ケーブル・C は 5V 3A / 9V 3A / 10V 2.25A / 15V 3A / 20V 2.25A(最大 45W)、A は 5V 3A / 9V 2A / 10V 2.25A / 12V 1.5A(最大 22.5W)。
  入力: ケーブル・C で 5V 3A / 9V 3A / 12V 2.5A / 15V 2A(最大 30W)。2つのポートを同時に使って本体を充電することはできない(取説)。
  パススルー: 「パススルー充電にも対応」。お使いの機器への充電が優先され、充電が終わってから本体への充電が始まる(製品ページの注意)。
  ケーブルは約7cm〜約70cmで8段階に長さを変えられる。USB-A には低電流モードがある。本体の充電時間・PD・PPS は公式に記載なし。
  Anker の自主回収の対象(2024年9月・2025年6月・2025年10月の掲載分)に A1638 は入っていない。発売は2025年9月。
