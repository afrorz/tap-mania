note: |
  容量の公式の書き方: 「5000mAh/3.85V/19.25Wh」、定格容量 2800mAh(5V⎓3A)。充電時間は約120分。取扱説明書 p.8 は20W以上の USB 充電器を勧めている。
  ワイヤレス出力: 製品ページの本文は「最大7.5W」「Qi2の15W/25Wワイヤレス充電には対応していません」。仕様欄と取扱説明書 p.12 の表記は「5W/7.5W/EPP15W」で、EPP15W がどの機器で出るのかは書かれていない。公式画像 No_12 の仕様表は「最大7.5W」。
  公式画像 No_10 に部品ごとの厚さ: ステンレス筐体 0.30mm・半固体系バッテリーセル 4.87mm・磁気コイル 0.8mm・ガラス繊維強化プラスチック 0.35mm(内部ケースの厚さは書かれていない)。前の型 SMARTCOBY ULTRA SLIM 3K は 3000mAh・4.98mm(公式画像 No_13)。
  NovaCore C3: USB-C の対応スマホと有線でつなぎ、CIO 公式アプリで健康状態(100%から減る数値)・セル温度・サイクル数・出力を見られる。Lightning 端子の iPhone は非対応。アプリなしでも使える。アプリの画面にはワイヤレス出力の設定と低電流モードの設定もある(公式画像 No_09)。
  300サイクル(容量100%分の充放電で1回。抜き差しの回数ではない)に達すると、充電機能が一時的にロックされる。取扱説明書の操作(ボタンをすばやく10回押す)かアプリで解除でき、解除後は20サイクルごとにお知らせが出る。CIO は300サイクル後の使用を勧めておらず、解除して使い続けた後の不具合は保証の対象外(取説 p.6・p.13・p.15)。
  LED は5つ。右の4つで残量を25%刻みに出し、左端はワイヤレス充電中に紫、パススルー中に紫、150回からのサイクル数の知らせで赤に光る(取説 p.8・p.9・p.13)。
  付属品: 製品ページの仕様欄は「取扱説明書(日本語/English)」だけだが、取扱説明書 p.12 と公式画像 No_12 は USB-C to USB-C ケーブルも付属と書いている。
  iPhone 17 へワイヤレスで約0.75回・有線で約0.85回(PR TIMES・公式画像 No_06)。iPhone 17 Pro へは有線で約0.7回・ワイヤレスで約0.6回(製品ページの FAQ)。
  Yahoo! ショッピングでは型番で見つからなかった(2026-11-27)。Amazon は B0H98MR6TB(製品ページのリンク)と B0H98HFB4N(PR TIMES のリンク)の2色、楽天は machinoomise の店。
  CIO の過去の回収は SMARTCOBY Ex01 SLIM Qi2 & CABLE(2025-01-27)で、型番が違う。消費者庁リコール情報サイトで「SMARTCOBY」「SS5K」「MB20W1C」を検索し、この型番は該当なし(2026-11-27)。NITE は未確認。
  出典: 製品ページ・取扱説明書(上の URL、2026-11-27 取得)、PR TIMES https://prtimes.jp/main/html/rd/p/000000723.000043212.html
pitch:   # 製品ページの頭の「特徴」(公式の事実だけ。安全の話は入れない)
  lead: "5000mAh の電池を、厚さ約6.93mm・約112g のステンレスの薄い箱に収めたマグネット式のバッテリーです。電池の健康度とサイクル数を、CIO のアプリで数字で見られます。"
  points:
    - "部品ごとの厚さを公式が出していて、セルが4.87mm、ステンレスの筐体が0.30mm"
