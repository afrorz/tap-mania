note: |
  発表は 2026-11-11、発売は「11月中旬」(日付は公式に無い)。11/14 時点で、楽天と Amazon には出ていない。Yahoo! の公式店(エレコムダイレクトショップ)で 7,480円。
  22.5W が出るのは HUAWEI 機器だけ。iPhone などは PD 最大20W、PPS 最大22W。
  USB-A の最大は、仕様欄が 22.5W、本文が「単独使用時で最大15W」で食い違う。
  入力は一体型ケーブルか C1 のどちらか(同時は不可)、5V/9V/12V・最大18W。
  使える温度は、給電時 -15〜45℃、充電時 0〜35℃。38.5Wh で機内に持ち込める(公式)。
  残量は LED パネルに 1% 単位。低電流モードと「おまかせ充電」は USB-A だけ。Switch 2 の充電に対応(ドックとの併用は不可)。
  定格容量は、底面印字の画像が読めないので空欄。同じシリーズに既存の 30W 版がある。
  エレコムのサイトは自動取得をはじく(403)。ブラウザでは画像が開ける。
