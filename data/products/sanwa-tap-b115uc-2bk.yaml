note: |
  定格容量は、コンセントと USB を併用するとき 100V・13.5A(1,350W 以下)、コンセントだけを使うとき 100V・15A(1,500W 以下)。公式ページ・取説 p.4。
  USB-C1/C2 の電圧: 5V/3A、9V/3A、12V/3A、15V/3A、20V/3.25A(最大65W)。USB-A1/A2: 5V/3A、9V/2A、12V/1.5A(最大18W)。
  PPS(取説 p.4): C1/C2 が65Wのとき 3.3-21V 5.0A(63W MAX)、45Wのとき 3.3-11V 3.0A(33W MAX)、30Wのとき 3.3-11V 3.0A(30W MAX)。
  4ポート同時の出力は、公式の仕様文が「5V/2.4A×4 最大65Wまで」、取説 p.4 の早見表の合計欄が 48W で、書き方がずれている。
  プラグは「2P(平行型・絶縁キャップ付き)」。差込口は両側面と上面に1口ずつで、全口にシャッター。過電流保護機能あり。日本国内専用。
  本体 約W70×D70×H72.5mm(クランプを除く)、約690g。取り付けられる天板の厚さは最大4cm(公式画像)。白は TAP-B115UC-2W。
  雷サージ・難燃性・マグネットは、公式ページにも取説にも記載なし。
