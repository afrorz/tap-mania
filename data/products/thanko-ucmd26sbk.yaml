note: |
  JAN 4580060605781。映像出力(DisplayPort Alternate Mode)には対応していない(製品ページの注記)。
  製品ページの仕様と取扱説明書の仕様の両方に「USBビデオクラス(UVC) 最大1080P@30Hzまたは720P@30Hz」という行があるが、何を指すかの説明はない(データには入れていない)。
  公式の仕様欄で、パッケージ込みの重量(約70g)が本体の重量(約70g)と同じ値になっている。パッケージサイズは幅110×奥行2×高さ180mm。
  ディスプレイは片方のコネクターだけ(取説 p.2 の各部名称)。ディスプレイの表示が何W 単位か・どちら向きの電力を表示するかは公式に書かれていない。
  付属は本体と日本語取扱説明書。製品ページでは 2026-11-16〜11-30 にセール価格 1,938円(一時的な値引きなので price には書いていない)。
  リコールは消費者庁リコール情報サイトで「UCMD26」を検索して該当なし(2026-11-24)。NITE は未確認。
  出典: 製品ページ https://www.thanko.jp/view/item/000000004860 ・取扱説明書(上の URL)。発表の報道 https://www.gdm.or.jp/pressrelease/2026/0622/640425 (いずれも 2026-11-24 取得)
pitch:   # 製品ページの頭の「特徴」(公式の事実だけ)
  lead: "ケーブルそのものに磁石が入っていて、巻くと磁力でくるっとまとまる USB-C ケーブルです。片方のコネクターに液晶があり、いま機器へ何W 出ているかが常に表示されます。"
  points:
    - "USB PD で最大100W(20V/5A)。e-Marker 搭載で、ノートPCの充電にも使える"
    - "PD で充電しているときは、ワット数の上に「PD」の文字が出る"
    - "ケーブル長 約940mm・径4mm・約70g。被覆はナイロン、プラグはアルミ合金"
