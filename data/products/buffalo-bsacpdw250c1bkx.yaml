note: |
  型番は BSACPDW250C1BKX(メタリックブラック・JAN 4950190385486)/ BSACPDW250C1WHX(シルキーホワイト・JAN 4950190385684)。シリーズ名は BSACPDW250C1X。依頼の「BSACPDW250C1BK」では公式ページが無く(404)、末尾に X が付く。
  製品ページに「この商品は特定販売店向けです」とある。プレスリリース(2026-11-12 発売)の販売先は Amazon・楽天市場・Yahoo!ショッピングのバッファロー公式ストア。通常販売価格 6,990円、発売記念キャンペーン 5,690円(上限で終了)。製品ページの価格欄は空。
  3つの使い方(公式の呼び方): コンセント直挿しスタイル / デスクスタンドスタイル(35W 以上の USB PD 充電器が別に必要) / PDチャージャースタイル。USB ケーブルは付属しない。
  ワイヤレスパッドは 0〜45°で無段階に傾けられる。マグネット吸着に対応しない機種はチルトが使えず、閉じて水平に置く。Qi2 認証(Qi ID:27464)。
  機種ごとのワイヤレスの最大(製品ページの表・2026年11月時点): iPhone 17 / 17 Pro / 17 Pro Max・18 Pro 系は 25W、iPhone Air 20W、iPhone 17e 15W、iPhone 16 / 16 Pro は 20W(iOS 26 以降)など。
  PPS の2台同時の電流は、公式の資料で食い違う: 製品ページの仕様は「PPS…5V～11V/2.22A」、取扱説明書は「PPS 5-11V/2.20A」、本体の印字(公式画像 0106)は「PPS:5V-11V 2.2A 20W Max」。
  1台のときの PPS は、製品ページ・取説が「PPS 5V～11V/3A」、本体の印字は「PPS:5V-11V 3A 33W Max」。
  大きさの書き方は、製品ページが「約60×40×60mm(幅×高さ×奥行、ACプラグ除く)」、取説が「約60×60×40mm(ワイヤレスパッド、電源プラグを折りたたんだ状態)」で、並べ方が違うだけで数字は同じ。
  取説: 金属をはさむと異物検出機能で充電を止める(金属の種類や大きさによっては検出できない)。製品ページ: チルト機構による熱分散、放熱素材、温度センサー内蔵(公式の書き方)。GaN は公式に記載なし。
  発売時期は製品ページ「2026年11月」、プレスリリースで 2026-11-12。
  消費者庁リコール情報サイトは 2026-11-24 に 504 エラーで引けなかった(recall_checked は空のまま)。
  出典: https://www.buffalo.jp/product/detail/bsacpdw250c1bkx.html ・ https://www.buffalo.jp/product/series/BSACPDW250C1X ・ https://manual.buffalo.jp/buf-doc/35023277-01.pdf ・ https://www.oricon.co.jp/pressrelease/3082479/
