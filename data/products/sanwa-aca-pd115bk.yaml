note: |
  ノートPC用の「電源コード型」AC アダプタ。本体と USB-C ケーブルが一体で、コンセント側は着脱式の AC 電源コード(2P)。タップに挿してもほかの差込口とぶつからない、とメーカーは書いている。
  サンワは「複数ポートの充電器をドッキングステーションにつなぎ、空きポートに別の機器を挿すと、映像・通信が一時的に切れることがあるが、本製品は一体型ケーブルからの出力だけなので切れる心配がない」と説明している。
  重さ 約320g は AC 電源コードを含まない値。使える温度 5〜35℃。通電確認 LED あり。PD は USB PD 3.0。PPS・GaN の記載は無い。
  発売日は製品ページに無い。2026-09-17 はニュースリリース(https://www.sanwa.co.jp/info/news/202609/aca-pd115bk/index.html)の日付。
  同じシリーズに PD65W の ACA-PD110BK、PD100W のケーブル一体型 ACA-PD94BK(15,180円)がある。
  取扱説明書の PDF と保証期間は製品ページで見つけられなかった(付属品に「取扱説明書・保証書」とだけある)。
  楽天・Yahoo! は公式店 サンワダイレクト(楽天 9,480円)。Amazon(B0HBWLLKDB)は 11/14 時点の販売元が「やるCAN」で公式・Amazon.co.jp ではないため stores に入れていない。
  消費者庁リコール情報サイトと NITE SAFE-Lite で「ACA-PD115BK」を引いて該当なし(2026-11-14)。
