note: |
  ケーブルの長さは、本文が「最大0.69M」、仕様欄が「0.7m」で食い違う(どちらも公式)。
  出力: 単一ポートで 65W Max。ただし巻き取り式ケーブルは最大60W(仕様欄と公式画像「巻き取り式ケーブル使用時 最大60W」)。USB-A の出力は仕様欄に無い。
  GaN の呼び方が本文の中で2つある: 「GaNInfinity テクノロジー」「GaNFast チップ」。仕様欄のチップは「GaNインフィニティ™」。電力変換効率は「最大95%」(公式)。8層の安全保護機能、独自の Thermal Guard 温度制御。
  プロトコル: PD3.0/2.0、QC4.0/3.0、PPS、AFC、FCP、APPLE 5V2.4A、BC1.2、SCP。入力電圧・プラグの折りたたみ・保証は公式ページに記載なし。
  重さは仕様欄が 290g。Amazon の商品名(B0DNSQCRJB)には「200g」「78cm」とあり公式と食い違うが、Amazon は出典にしない。
  値段は、公式サイトの通常価格 5,680円、Amazon 6,280円、UGREEN 公式楽天市場店 6,480円(いずれも 11/14 時点・税込)。
  公式ページの「Amazonで購入」は B0DNSQCRJB(販売元 Ugreen Japan Co., Ltd)、「楽天で購入」は UGREEN 公式楽天市場店(ugreen-gear)。Yahoo! では公式店が見つからなかった。
  発売日は公式ページに無い(2025年夏ごろから日本で売られているという報道はある)。
  上位に Nexode Pro 160W 巻き取りケーブル内蔵充電器(17,980円・画面付き)もあるが、ugreen.jp の製品ページに仕様の文字が無いため今回は外した。
  消費者庁リコール情報サイトと NITE SAFE-Lite で「UGREEN」「55897」を引いて該当なし(2026-11-14)。
