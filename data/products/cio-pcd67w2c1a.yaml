note: |
  定格は、コンセントだけ使うとき 100-125VAC・7A・875W Max、コンセントと USB を併用するとき 100-125VAC・6A・750W Max(公式ページの仕様・取説 p.5)。
  USB を1ポートだけ使うとき、C1/C2 は 5V⎓3A / 9V⎓3A / 12V⎓3A / 15V⎓3A / 20V⎓3.35A(Max 67W)・PPS 3.3-11V⎓5A。A は 5V⎓3A / 9V⎓2A / 12V⎓1.5A(Max 18W)。
  公式の資料どうしで同時出力の書き方がずれている。仕様表の画像(09_DESK_LP-1.jpg)は「※複数ポート接続時USB-Aは15W Max」、早見表と取説は「C1+A: 45W+18W(計63W)」。
  20W 時の 9V の電流は、公式ページの仕様で 9V=2.25A、取説 p.5 で 9V⎓2.22A。
  C1+C2 の振り分けは「Nova Intelligence」による自動で、手動では決められない(取説 p.8)。
  急速充電の規格は PD3.0 / PPS / QC4.0+(取説 p.6)。公式ページに「次世代半導体GaNを採用」。液晶でポートごとの給電 W 数が見える。過電流保護機能あり(取説 p.7)。
  トラッキング対策・スイッチ・雷サージは記載なし。本体 約76.5×66.8×49mm・約228g(ケーブル約100g は別)。
  Yahoo!ショッピングにはメーカー公式の店が見当たらないので stores から外した。
