  lead: "丸みのある透明な PC の外殻が、ベージュの本体を包む形の35W 充電器です。ポート面には出力ディスプレイがあり、いま機器に供給している電力が数字で出ます。"
  points:
    - "USB-C は1ポートで最大35W、USB-A は最大30W。2つ同時だと合計17W(5V 3.4A)"
