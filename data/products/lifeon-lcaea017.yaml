note: |
  見た目: 丸みのある透明な PC の外殻が、ベージュの本体を包む形(公式写真)。材質は「本体：PC」(仕様)。プレスリリースの見出しは「コロンと丸いフォルムと透明感のあるデザイン」。同じシリーズの LCAEA018(67W・机に置く形)と同じ透明デザインで、こちらはコンセントに直接挿す形。
  1ポートのとき: USB-C は 5V 3A, 9V 3A, 12V 2.5A, 15V 2.33A, 20V 1.75A(最大35W)。USB-A は 5V 3A, 9V 3A, 12V 2.5A, 20V 1.5A(最大30W)。
  2ポート同時は「USB-C+A：5V 3.4A（最大17W）」だけが書かれていて、ポートごとの配り方は書かれていない。total_w は1ポート時と同時使用時で値が違うので書いていない。
  出力ディスプレイ: 上面(ポート面)にあり、供給している電力が数字で出る。充電する機器が10W 以上になると稲妻のマークが付く(取説 p.3)。公式写真の注記に「出力ディスプレイ表示は参考値」「モバイルバッテリー機能はございません」。
  PD・PPS・Quick Charge・GaN は製品ページの説明から。Quick Charge の版は公式に記載なし。スイングプラグ(折りたたみ式)は製品ページ。
  USB ケーブルは付属しない。セット内容は本体と取扱説明書(保証書付)。補修用性能部品の保有期間は生産終了後3年(取説 p.5)。JAN 4944370064773(ベージュ)。
  発売: Life on Products オフィシャルストアで2026年4月6日、全国の雑貨店・量販店・オンラインショップで4月27日から(PR TIMES https://prtimes.jp/main/html/rd/p/000000405.000073257.html )。
  売り場: 楽天・Yahoo! は「ライフオンプロダクツ 公式店」、Amazon も「LCAEA017」の検索で一番上にこの製品(11/24 確認。Amazon の出品者名は確かめていない)。
  リコール: 消費者庁リコール情報サイトで「LCAEA017」「ライフオンプロダクツ」を検索して0件(2026-11-24)。NITE は未確認。
