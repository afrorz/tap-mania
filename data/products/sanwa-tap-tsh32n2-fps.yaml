note: |
  タップの中に「消火シート」を入れた火災予防タップ。シートは板状のシリコン材(厚さ約1mm)で、消火剤入りのマイクロカプセルを組み込み、表面は剥離フィルム(75μm PET)。
  公式の仕様: 作動温度 130℃±10℃、作動範囲「タップ内部の密閉空間」、作動時間「約90秒以内(使用環境により異なります)」、使用寿命 約5年(タップを交換する時期と同じ)。一度でも働いたら使用をやめて交換、と書かれている。
  公式の説明は「タップ内部で初期火災を抑制」「火を外に出さず、内部で消火」。消火や防火の効果を保証する言葉は書かれていない。記事でも効果を言い切らない。
  差込口は 2P・3個口(2口が上面、1口が端面。間隔32mm)。プラグは2P のスイングプラグ(公式画像で180°回る)。使用地域は日本国内のみ。
  一般社団法人防災安全協会の「防災製品等推奨品マーク」取得と書かれている。雷サージ・スイッチの記載は無い。
  寸法は、仕様欄が W97.5×D40×H21mm、比較表が W40×D21×H97.5mm で、縦横の並びが食い違う(同じ大きさの書き方の違いとみられる)。製品ページの画像の説明文に「1m」とある箇所があるが、仕様欄のコード長は 2m。
  シリーズ: TAP-TSH31N2-FPS(1m・200g・1,980円)、TAP-TSH32N2-FPS(2m・230g・2,310円)、TAP-TSH33N2-FPS(3m・2,750円)、TAP-TSH35N2-FPS(5m・3,630円)。いずれも税込の標準価格。直挿し型の TAP-AC3WN2-FPS も同じ日に出た。
  消火シートの無い従来品「火災予防安全タップ TAP-TSH32N」「TAP-TSH32SWN」が Amazon で並んで売られている。型番の末尾「N2-FPS」で区別する。
  発売日は、ニュースリリース(https://www.sanwa.co.jp/info/news/202609/tap-ac3wn2-fps/index.html)の日付。製品ページに発売日の記載は無い。取扱説明書の PDF は製品ページから直接は見つからない。
  楽天はサンワダイレクト(item.rakuten.co.jp/sanwadirect/tap-tsh32n2-fps/)、Yahoo! はサンワダイレクトほか、Amazon は「サンワサプライ 火災予防タップ（消火シート内蔵・2m）」(2026-11-16 検索)。
