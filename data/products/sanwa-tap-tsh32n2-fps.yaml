    - "コードは2m、重さ230g。差込口は上面に2口と端面に1口で、机まわりの充電器をまとめられる"
    - "消火シートの使用寿命は約5年で、タップを交換する時期と同じ。長さは1m・2m・3m・5mから選べる"
