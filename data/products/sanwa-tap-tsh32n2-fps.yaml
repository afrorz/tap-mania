  lead: "白い3個口の延長タップの中、差込口の横に消火剤入りのシートが2枚入っています。メーカーによると、タップ内部が130℃±10℃になるとシートのマイクロカプセルから消火剤が出て、内部の密閉空間で初期火災を抑える仕組みです。"
  points:
