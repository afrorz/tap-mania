note: |
  容量の公式の書き方: 「バッテリー容量 2500mAh/7.4V/18.5Wh」「バッテリーセル 2500mAh × 2pcs(Total 5000mAh)」。定格容量 2900mAh(5V=3A)は取扱説明書だけに書かれている。
  「半固体系」は、CIO の注記で「半固体/準固体の定義には統一見解がないため、CIOでは独自基準を満たしたバッテリーを「半固体系」と定義」とされている。
  出力: 5V⎓3A/9V⎓2.22A/12V⎓1.67A(Max 20W)/PPS 5-11V⎓2A(Max 22W)。入力: 5V⎓3A/9V⎓2.22A/12V⎓1.67A(Max 20W)。対応規格は Qi2.2(25W)/PD3.0。
  Qi2.2 の機器へは最大25W、Qi2 の機器へは最大15W。出力モードは3つ(ハイパフォーマンス 25W・セーフティー 7.5W・低電流)で、ボタン5秒長押しで切り替える。初期設定はハイパフォーマンス(取説 p.16〜21)。
  ワイヤレス充電中にケーブルで機器をつなぐと、有線が優先されてワイヤレスは止まる(製品ページの FAQ と取説 p.9・p.12)。同じ CIO の Ex05 と違い、ワイヤレスと有線を同時に使うモードは無い。
  内蔵ケーブルは約21cm・脱着式で、Ex01 用の交換ケーブルとは互換性がない(公式 FAQ)。残量は1%単位のデジタル表示。完全パススルー対応。サイクル回数は約400回。
  公式画像 LP16 の中で、満充電までの時間が食い違う: 大きな文字は「約90分で満充電」、同じ画像の小さな文字は「急速充電器を用いることで約130分で満充電」。製品仕様と取説は「約90分」。
  公式画像 LP14 に、iPhone 17 Pro を有線で約0.77回・ワイヤレスで約0.66回、iPhone 16 Pro を有線で約0.88回・ワイヤレスで約0.80回充電できるとある(製品ページの本文と同じ)。
  Yahoo! ショッピングでは型番で見つからなかった(2026-11-24)。Amazon は公式リンク B0FTZ41VT6、楽天は machinoomise の店。
  CIO の過去の回収は SMARTCOBY Ex01 SLIM Qi2 & CABLE(2025-01-27)で、型番が違う。消費者庁リコール情報サイトで「MB20W2C」「SMARTCOBY」を検索し、Ex04 は該当なし(2026-11-24)。NITE は未確認。
  出典: 製品ページ・取扱説明書(上の URL、2026-11-24 取得)。発売日は PR TIMES https://prtimes.jp/main/html/rd/p/000000671.000043212.html と報道。
pitch:   # 製品ページの頭の「特徴」(公式の事実だけ)
  lead: "厚さ約14mm・151g の5000mAh バッテリーに、Qi2.2 のワイヤレス充電と、本体から外せる約21cm の USB-C ケーブルを載せています。セルは、CIO が独自の基準で『半固体系』と呼ぶものを使っています。"
  points:
    - "ワイヤレスは Qi2.2 で最大25W。Qi2 の機器へは最大15Wで、マグネットで付けて充電できる"
    - "内蔵ケーブルと USB-C ポートはどちらも最大20Wの入出力。2本同時なら合計15W"
    - "残量は1%単位のデジタル表示。本体の充電は約90分で、完全パススルーにも対応"
